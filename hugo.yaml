baseURL: "https://fuckai001.com/"
title: "疯狂阿北"
languageCode: "zh-CN"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
theme: "hugo-theme-relearn"
enableRobotsTXT: true
disableKinds: [taxonomy, term]

cascade:
  params:
    search: false

outputs:
  home: [html, rss, print]
  section: [html, rss, print]
  page: [html, print]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  # Match the official Relearn documentation site's variants and default mode.
  themeVariant:
    - identifier: relearn-auto
      name: "Relearn Light/Dark"
      auto: [relearn-light, relearn-dark]
    - identifier: relearn-dark
    - identifier: relearn-light
    - identifier: relearn-bright
    - identifier: zen-auto
      name: "Zen Light/Dark"
      auto: [zen-light, zen-dark]
    - identifier: zen-dark
    - identifier: zen-light
    - identifier: retro-auto
      name: "Retro Learn/Neon"
      auto: [learn, neon]
    - identifier: neon
    - identifier: learn
    - identifier: blue
    - identifier: green
    - identifier: red
  disableLandingPageButton: true
  disableRootBreadcrumb: true
  disableExplicitIndexURLs: true
  disableSearchHiddenPages: true
  disableSeoHiddenPages: true
  disableTagHiddenPages: true
  disableInlineCopyToClipBoard: true
  showVisitedLinks: false
  collapsibleMenu: true
  alwaysopen: false
  browserTabTitle: "疯狂阿北 - 商业 · 科技 · 组织和人。"
  sidebarHeaderMenus: []
  sidebarFooterMenus: []
  search:
    disable: true
    index:
      disable: true
    page:
      disable: true
  ordersectionsby: "weight"
  titleSeparator: "·"
  hideAuthorDate: true
  dateFormat: "2006年01月02日"
  math: true
